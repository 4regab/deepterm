  <!-- Replace with your own Google Analytics tracking ID -->

  <script type="module">
    // Initialize Google Analytics only if tracking ID is provided
    const trackingId = import.meta.env.VITE_GA_TRACKING_ID;
    if (trackingId && trackingId !== 'GA_TRACKING_ID') {
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }

      // Set default consent state - MUST be before gtag('js') and gtag('config')
      gtag('consent', 'default', {
        'analytics_storage': 'denied',
        'ad_storage': 'denied',
        'ad_user_data': 'denied',        // Consent Mode v2
        'ad_personalization': 'denied',  // Consent Mode v2
        'wait_for_update': 500 // Optional: waits 500ms for update command
      });

      gtag('js', new Date());
      gtag('config', trackingId);
      
      // Load GA script
      const script = document.createElement('script');
      script.async = true;
      script.src = `https://www.googletagmanager.com/gtag/js?id=${trackingId}`;
      document.head.appendChild(script);
    }
  </script>
