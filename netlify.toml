[build]
  publish = "dist"
  command = "npm run build"

# Increase timeout for all functions (can be function-specific if needed)
[functions]
  timeout = 60 

[context.production]
  environment = { VITE_APP_ENV = "production" }

[context.deploy-preview]
  environment = { VITE_APP_ENV = "preview" }

[context.branch-deploy]
  environment = { VITE_APP_ENV = "branch" }

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
