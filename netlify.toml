[build]
  publish = "dist"
  command = "npm run build"

# Increase function timeout to 28 seconds
[functions]
  timeout = 28

[context.production]
  environment = { VITE_APP_ENV = "production" }

[context.deploy-preview]
  environment = { VITE_APP_ENV = "preview" }

[context.branch-deploy]
  environment = { VITE_APP_ENV = "branch" }

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
